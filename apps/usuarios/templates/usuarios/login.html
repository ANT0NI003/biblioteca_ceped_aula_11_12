{% extends 'core/base.html' %}
{% load widget_tweaks %}
{% block title %}Login{% endblock %}


{% block content %}

<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <div class="col-md-4 col-sm-8">

            <div class="card shadow-lg border-0">
                <div class="card-body p-4">

                    <div class="text-center mb-3">
                        <i class="bi bi-book fs-1 text-primary"></i>
                    </div>

                    <h3 class="text-center mb-4 text-primary">
                        Biblioteca Cepedi
                    </h3>

                    <form action="{% url 'usuarios:login' %}" method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-person"></i> Usuário
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Digite seu usuário"
                                name="username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-lock"></i> Senha
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                placeholder="Digite sua senha"
                                name="senha"
                                required
                            >
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary ">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar na Biblioteca
                            </button>
                        </div>
                    </form>
                    <label></label>
                     <div class="d-grid gap-2 mt-3">
                        <a href="{% url 'index' %}" class="btn btn-primary">
                            Voltar
                        </a>

                        <a href="{% url 'usuarios:inserir_usuario' %}" class="btn btn-primary">
                            Cadastrar
                        </a>
                    </div>

                </div>
            </div>

            <p class="text-center text-muted mt-3">
                <i class="bi bi-book-half"></i> Sistema de Gerenciamento de Biblioteca
            </p>

        </div>
    </div>
</div>

{% endblock %}
